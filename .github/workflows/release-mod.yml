name: Release in-game mod

on:
  push:
    branches: [main, feat/in-game-mod]
    paths:
      - site/public/data/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/pack-mod.mjs --release --out dist/mod
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d '[:space:]' < dist/mod/VERSION)
          LAST=$(gh release view --json targetCommitish --jq -r .targetCommitish || true)
          if [ -n "$LAST" ] && git cat-file -e "$LAST^{commit}" && git diff --quiet "$LAST" HEAD -- site/public/data; then
            echo "site/public/data unchanged since $LAST, skip"
            exit 0
          fi
          gh release create "v$VER" dist/mod/*.zip \
            --target "${{ github.sha }}" \
            --title "Stalker DB $VER" \
            --notes-file dist/mod/NOTES
