name: Release in-game mod

on:
  push:
    branches: [main, feat/in-game-mod]
    paths:
      - mod/**
      - scripts/pack-mod.mjs
      - site/public/data/packs.json
      - site/public/data/*/*.json
      - .github/workflows/release-mod.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/pack-mod.mjs --release --out dist/mod
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d '[:space:]' < dist/mod/VERSION)
          gh release create "v$VER" dist/mod/*.zip \
            --target "${{ github.sha }}" \
            --title "Stalker DB $VER" \
            --notes-file dist/mod/NOTES
